<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #0a0b10; color: white; padding: 20px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; box-sizing: border-box; }
        button { background: #00e5ff; color: black; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:disabled { opacity: 0.5; }
        .preview { width: 100%; height: 200px; background: #1e2132; border-radius: 8px; background-size: contain; background-repeat: no-repeat; background-position: center; margin-top: 10px; }
        #status { margin-top: 15px; font-weight: bold; color: #00e5ff; text-align: center; }
    </style>
</head>
<body>
    <h2>Добавить товар</h2>
    <input type="text" id="name" maxlength="100" placeholder="Название (Модель или Вкус)">
    <input type="number" id="price" min="1" placeholder="Цена (₽)">
    <select id="category">
        <option value="Жидкости">Жидкости</option>
        <option value="Устройства">Устройства</option>
        <option value="Обслуга">Обслуга</option>
    </select>

    <label>Фото:</label>
    <input type="file" id="photoInput" accept="image/*">
    <div class="preview" id="preview"></div>
    <div id="status"></div>

    <button id="submitBtn" onclick="uploadAndSend()">Загрузить в магазин</button>

    <script>
        const SERVER_URL = "https://vape-shop-server.onrender.com"; // без слэша на конце

        const tg = window.Telegram.WebApp;
        tg.expand();
        let selectedFile = null;

        document.getElementById('photoInput').addEventListener('change', function (e) {
            selectedFile = e.target.files[0];
            if (!selectedFile) return;
            const reader = new FileReader();
            reader.onload = function (event) {
                document.getElementById('preview').style.backgroundImage = `url('${event.target.result}')`;
            };
            reader.readAsDataURL(selectedFile);
        });

        async function uploadAndSend() {
            const name = document.getElementById('name').value.trim();
            const price = document.getElementById('price').value;
            const category = document.getElementById('category').value;
            const statusEl = document.getElementById('status');
            const btn = document.getElementById('submitBtn');

            if (!name || !price) {
                tg.showAlert("Заполни название и цену!");
                return;
            }
            if (!tg.initData) {
                statusEl.innerText = "❌ Открой админку через кнопку в боте.";
                return;
            }

            const fd = new FormData();
            fd.append('name', name);
            fd.append('price', price);
            fd.append('category', category);
            if (selectedFile) fd.append('photo', selectedFile);

            btn.disabled = true;
            statusEl.innerText = "⏳ Добавляю товар...";
            try {
                const r = await fetch(`${SERVER_URL}/products/add`, {
                    method: 'POST',
                    headers: { 'X-Init-Data': tg.initData },
                    body: fd
                });
                if (!r.ok) {
                    const err = await r.json().catch(() => ({}));
                    const detail = typeof err.detail === 'string' ? err.detail : "Ошибка " + r.status;
                    statusEl.innerText = "❌ " + detail;
                    return;
                }
                statusEl.innerText = "✅ Товар добавлен!";
                document.getElementById('name').value = '';
                document.getElementById('price').value = '';
                document.getElementById('photoInput').value = '';
                document.getElementById('preview').style.backgroundImage = '';
                selectedFile = null;
                tg.HapticFeedback?.notificationOccurred('success');
            } catch (e) {
                statusEl.innerText = "❌ Ошибка сети: " + e.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
